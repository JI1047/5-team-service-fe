name: Frontend CI/CD

on:
  push:
    branches:
      - feature/cicd

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-build-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

      - name: Build Next.js app (single build source)
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL_DEV }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_DEV }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_DEV }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEV }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_DEV }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID_DEV }}
          NEXT_PUBLIC_FIREBASE_APPID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPID_DEV }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY_DEV }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_DEV || '' }}
          NEXT_PUBLIC_SENTRY_ENV: development

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-build-${{ github.sha }}
          path: |
            .next
            public
            Dockerfile
          retention-days: 3

  deploy-static-from-artifact:
    needs: ci-build-once
    if: ${{ needs.ci-build-once.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-build-${{ github.sha }}
          path: ./build-artifact

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload static assets to S3 (stabilization mode)
        run: |
          BUCKET="${{ secrets.S3_STATIC_BUCKET_DEV }}"
          if [ -z "$BUCKET" ]; then
            echo "::error::S3_STATIC_BUCKET_DEV secret is not set"
            exit 1
          fi

          # 1st stabilization phase: keep old hashes by not deleting objects.
          aws s3 sync build-artifact/.next/static "s3://${BUCKET}/_next/static" \
            --cache-control "public,max-age=31536000,immutable"

          if [ -d build-artifact/public ]; then
            aws s3 sync build-artifact/public "s3://${BUCKET}/public" \
              --cache-control "public,max-age=3600"
          fi

  build-and-push-image-from-same-artifact:
    needs: deploy-static-from-artifact
    if: ${{ needs.deploy-static-from-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-build-${{ github.sha }}
          path: ./build-artifact

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ secrets.ECR_REPOSITORY }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="sha-${SHORT_SHA}"

          {
            echo "tags<<EOF"
            echo "${REGISTRY}/fe-test:${TAG}"
            echo "${REGISTRY}/fe-test:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "image-tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker context from single build artifact
        run: |
          mkdir -p image-context
          cp build-artifact/Dockerfile image-context/Dockerfile
          cp -R build-artifact/.next image-context/.next
          cp -R build-artifact/public image-context/public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image (prebuilt target)
        uses: docker/build-push-action@v6
        with:
          context: ./image-context
          file: ./image-context/Dockerfile
          target: prebuilt-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-dev-via-ssm:
    needs: build-and-push-image-from-same-artifact
    if: ${{ needs.build-and-push-image-from-same-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Precheck SSM target availability
        run: |
          ONLINE_COUNT=$(aws ssm describe-instance-information \
            --filters \
              "Key=tag:Role,Values=fe" \
              "Key=tag:Name,Values=doktori-fe" \
              "Key=tag:Stack,Values=compute" \
              "Key=tag:Project,Values=doktori" \
            --query "length(InstanceInformationList[?PingStatus=='Online'])" \
            --output text)

          if [ -z "$ONLINE_COUNT" ] || [ "$ONLINE_COUNT" = "0" ] || [ "$ONLINE_COUNT" = "None" ]; then
            echo "::error::No online SSM target instance matched required tags"
            exit 1
          fi

          echo "Matched online SSM targets: $ONLINE_COUNT"

      - name: Deploy to Dev via SSM
        run: |
          TAG="${{ needs.build-and-push-image-from-same-artifact.outputs.image-tag }}"

          COMMANDS=$(jq -n --arg registry "${{ secrets.ECR_REPOSITORY }}" --arg tag "$TAG" '[
            "set -e",
            ("aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin " + $registry),
            ("docker pull " + $registry + "/fe-test:" + $tag),
            "docker stop frontend 2>/dev/null || true",
            "docker rm frontend 2>/dev/null || true",
            ("docker run -d --name frontend --restart unless-stopped -p 3000:3000 " + $registry + "/fe-test:" + $tag),
            "docker image prune -f"
          ]')

          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Role,Values=fe" "Key=tag:Name,Values=doktori-fe" "Key=tag:Stack,Values=compute" "Key=tag:Project,Values=doktori" \
            --parameters "{\"commands\": $COMMANDS}" \
            --timeout-seconds 300 \
            --comment "deploy dev frontend ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
                exit 1 ;;
            esac
          done

          echo "::error::SSM command timed out"
          exit 1

      - name: Notify Discord
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="배포 성공"
          else
            COLOR=15158528; STATUS_EMOJI="❌"; STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **Frontend Development 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"🔧 [Development] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

  invalidate-cloudfront:
    needs: deploy-dev-via-ssm
    if: ${{ needs.deploy-dev-via-ssm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}"
          if [ -z "$DIST_ID" ]; then
            echo "::error::CLOUDFRONT_DISTRIBUTION_ID_DEV secret is not set"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
